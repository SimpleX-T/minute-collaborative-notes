services:
  - type: web
    name: minute-collaboration
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_EMBED_ORIGINS
        value: https://meet.google.com,https://*.teams.microsoft.com,https://app.slack.com
      - key: DATA_DIR
        value: /tmp/minute-data
